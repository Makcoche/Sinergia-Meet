# ============================================================================
# SINERGIA MEET - HIGH CONCURRENCY NGINX REVERSE PROXY PROFILE (nginx.conf)
# Production-ready SSL termination, WebSocket protocols and HTTP/2
# ============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048; # Scalability: Support up to 2048 concurrent handshakes per core
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance Tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off; # Avoid system fingerprint vulnerability leaks

    # Gzip Compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # SSL Globals (Mozilla Modern Configuration guidelines)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Forward upstream server definition
    upstream sinergia_backend {
        server 127.0.0.1:3000;
        keepalive 32;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name sinergiameet.com www.sinergiameet.com turn.sinergiameet.com;

        # Automated Let's Encrypt validation
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Global redirect to secure channels
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name sinergiameet.com www.sinergiameet.com;

        # SSL Certificates (Volume mapped from Let's Encrypt / Certbot container)
        ssl_certificate /etc/letsencrypt/live/sinergiameet.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/sinergiameet.com/privkey.pem;

        # Security Headers (OWASP Checklist)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval' wss: ws:; frame-ancestors 'self';" always;

        # Applet / API router
        location / {
            proxy_pass http://sinergia_backend;
            proxy_http_version 1.1;
            
            # WebSocket and Connection Upgrade Mappings (CRITICAL FOR SOCKET.IO / SIGNALS)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Proxied Header sync
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Extended Buffers for 100+ connection persistence
            proxy_connect_timeout 60s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
        }
    }
}
