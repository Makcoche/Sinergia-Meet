# ============================================================================
# SINERGIA MEET - CORE ENTERPRISE COTURN CONFIGURATION (coturn.conf)
# Production-ready NAT Traversal, STUN/TURN optimization
# ============================================================================

# Network Ports
listening-port=3478
tls-listening-port=5349

# Listen on all virtual and physical interfaces
listening-ip=0.0.0.0

# Production Public Address (Replace with your actual VPS public IP)
# external-ip=YOUR_VPS_PUBLIC_IP

# Enable TLS/SSL for secure TURN (TURNS)
# cert=/etc/letsencrypt/live/turn.sinergiameet.com/fullchain.pem
# pkey=/etc/letsencrypt/live/turn.sinergiameet.com/privkey.pem

# TLS Settings
cipher-list="ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES255-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384"
tls-version=tls1.2,tls1.3

# Auth Settings
# Use static long-term credentials matching the client configurations
lt-cred-mech
user=sinergia_sec_user:SinergiaSuperSecureCredential2026

# Realm matches the domain identifier
realm=turn.sinergiameet.com

# Performance and Limits Tuning
max-bps=0
total-quota=0
user-quota=0

# Clean up stale connections quickly to optimize memory (ideal for 100+ concurrent user loops)
stale-nonce=600

# Prevent security loopholes: turn off loopback peers
no-loopback-peers
no-multicast-peers

# Keep logging clean and precise
log-file=/var/log/turnserver/turn.log
simple-log
verbose
