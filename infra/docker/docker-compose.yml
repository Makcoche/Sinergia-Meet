# ============================================================================
# SINERGIA MEET - MULTI-CONTAINER PRODUCTION ORCHESTRATION (docker-compose.yml)
# High availability video networks, SSL setups, Coturn and Nginx bindings
# ============================================================================

version: '3.8'

services:
  # 1. Sinergia Meet Full-Stack Node Application
  sinergiameet-app:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile
    container_name: sinergiameet_app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3000
    expose:
      - "3000"
    networks:
      - sinergia-net

  # 2. High-Performance Coturn STUN/TURN Media Server
  coturn:
    image: coturn/coturn:latest
    container_name: sinergiameet_coturn
    restart: unless-stopped
    network_mode: "host" # High speed: Bypass container overlay lag for WebRTC UDP packets
    volumes:
      - ../coturn/coturn.conf:/etc/coturn/turnserver.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro # Mount SSL directory for secure TURNS protocol
    ports:
      # STUN/TURN over UDP & TCP
      - "3478:3478"
      - "3478:3478/udp"
      # Secure STUN/TURN TLS (TURNS) over UDP & TCP
      - "5349:5349"
      - "5349:5349/udp"
      # Dynamic Port allocation block for peer-to-peer tunnels
      - "49152-65535:49152-65535/udp"

  # 3. Secure Reverse Proxy / SSL Termination Router (Nginx)
  nginx:
    image: nginx:alpine
    container_name: sinergiameet_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro # Read Certificates securely 
      - certbot-web:/var/www/certbot:ro      # Automate acme-challenge routing
    depends_on:
      - sinergiameet-app
    networks:
      - sinergia-net

  # 4. Automated Let's Encrypt Certificate Renewals (Certbot)
  certbot:
    image: certbot/certbot
    container_name: sinergiameet_certbot
    restart: unless-stopped
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - certbot-web:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  sinergia-net:
    driver: bridge

volumes:
  certbot-web:
